# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- dev

pool:
  name: Default
  demands: agent.name -equals ayushagent

#variables:
  #ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
  # ARM_TENANT_ID: $(ARM_TENANT_ID)
  # ARM_CLIENT_ID: $(ARM_CLIENT_ID)
  # ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)  

steps:
  - task: TerraformTask@5
    displayName: tf init
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendAzureRmUseEntraIdForAuthentication: false
      backendServiceArm: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'
      backendAzureRmStorageAccountName: 'ayushbackendtfstate'
      backendAzureRmContainerName: 'tfstate'
      backendAzureRmKey: 'prod.terraform.tfstate'
    env:
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)  
      
  - task: TerraformTask@5
    displayName: tf validate
    inputs:
      provider: 'azurerm'
      command: 'validate'

  - task: TerraformTask@5
    displayName: tf format
    inputs:
      provider: 'azurerm'
      command: 'custom'
      outputTo: 'console'
      customCommand: 'fmt'
      environmentServiceNameAzureRM: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'

  - task: TerraformTask@5
    displayName: tf plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      environmentServiceNameAzureRM: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'

  - task: ArchiveFiles@2
    displayName: archive files
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)/'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: publish build artifacts
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: '$(Build.BuildId)-build'
      publishLocation: 'Container'

  - task: ExtractFiles@1
    displayName: extract artifacts
    inputs:
      archiveFilePatterns: _$(BuildDefinitionName)/$(Build.BuildId)-build/$((Build.BuildId).zip
      destinationFolder: "$(System.DefaultWorkingDirectory)/"
      cleanDestinationFolder: true
      overwriteExistingFiles: false

  - task: TerraformTask@5
    displayName: tf apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      commandOptions: '--auto-approve'
      environmentServiceNameAzureRM: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'
