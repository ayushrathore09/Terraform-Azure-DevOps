# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- dev

pool:
  name: Default
  demands: agent.name -equals ayushagent

steps:
  - task: TerraformTask@5
    displayName: tf init
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendAzureRmUseIdTokenGeneration: true
      backendServiceArm: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'
      backendAzureRmStorageAccountName: 'ayushtestterraform'
      backendAzureRmContainerName: 'tfstate'
      backendAzureRmKey: 'prod.terraform.tfstate'

  - task: TerraformTask@5
    displayName: tf validate
    inputs:
      provider: 'azurerm'
      command: 'validate'

  - task: TerraformTask@5
    displayName: tf format
    inputs:
      provider: 'azurerm'
      command: 'custom'
      outputTo: 'console'
      customCommand: 'fmt'
      environmentServiceNameAzureRM: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'

  - task: TerraformTask@5
    displayName: tf plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      environmentServiceNameAzureRM: 'Azure subscription 1(360e0ea4-2134-44ec-ae92-0602fee6c212)'

  - task: ArchiveFiles@2
    displayName: archive files
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: true
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: publish build artifacts
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: '$(Build.BuildId)-build'
      publishLocation: 'Container'