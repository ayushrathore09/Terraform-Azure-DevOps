trigger:  # ci trigger to deploy the actual changes
  branches:
    include:
      - main

pr:  # pr trigger for validation pipeline for dry run
  branches:
    include:
      - main
      
pool: 
  name: default
  demands: agent.name -equals ayushagent  #strictly to run on specific agent

stages:
  - stage: tf_plan
    displayName: "Terraform plan"
    jobs:   # each stage can have multiple jobs can be run in parallel or sequentially with condition
      - job: tf_init
        steps:
          - checkout: self
          - script: |
              terraform init
              echo "checking tf files"
              dir "$(Build.SourcesDirectory)"
         
          # publish .terraform and .terraform.lock.hcl as pipeline artifacts
          - task: PublishBuildArtifacts@1  
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)'
              ArtifactName: 'terraform_init_artifact'
              publishLocation: 'Container'

      - job: tf_fmt
        steps: 
          - checkout: self
          - script: |
              terraform fmt -check

      - job: terraform_validate
        dependsOn: tf_init
        steps:
          - checkout: self
          #download previously published artifacts 
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              ArtifactName: 'terraform_init_artifact'
              downloadPath: '$(Build.SourcesDirectory)/terraform'

          - script: |
              echo "entering workspace..."
              cd "$(Build.SourcesDirectory)\terraform\terraform_init_artifact\"
              terraform validate

      - job: tf_plan
        dependsOn: tf_init
        steps:
          - checkout: self
          - script: |
              echo "creating the terraform plan"
              terraform init -input=false
              terraform plan -out=tfplan
              terraform show -no-color tfplan > tfplan_output.txt

            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)'
              ArtifactName: 'tf_plan_file'
              publishLocation: 'Container'
########################################### tf apply ###########################################
# Have to add some condition in this tf-apply stage so that pr validation wont be able to run this stage.

  - stage: tf_apply
    dependsOn: tf_plan
    condition: and(
      succeeded(),
      eq(variables['Build.SourceBranch'],'refs/heads/main'))
    
    displayName: 'terraform apply'

    jobs:
      - deployment: tf_apply_dev
        environment: 'tf-apply-dev'
        strategy:
          runOnce:
            deploy: 
              steps:
                - checkout: self
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    ArtifactName: 'tf_plan_file'
                    downloadPath: '$(Build.SourcesDirectory)/terraform'

                - script: |
                    cd "$(Build.SourcesDirectory)\terraform\tf_plan_file"
                    echo "Applying Terraform Plan..."
                    terraform apply -auto-approve tfplan
                    terraform destroy -auto-approve 

                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)  


