trigger:
  branches:
    include:
      #- main
      - dev
  
pool: 
  name: default
  demands: agent.name -equals ayushagent  #strictly to run on specific agent

stages:
  - stage: tf_plan
    displayName: "Terraform plan"
    jobs:   # each stage can have multiple jobs can be run in parallel or sequentially with condition
      - job: terraform_init
        steps:
          - checkout: self
          - script: |
              terraform init
              echo "checking tf files"
              dir "$(Build.SourcesDirectory)"
         
          # publish .terraform and .terraform.lock.hcl as pipeline artifacts
          - task: PublishBuildArtifacts@1  
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)'
              ArtifactName: 'terraform_init_artifact'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1  
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/.terraform.lock.hcl'
              ArtifactName: 'tf_lock'
              publishLocation: 'Container'

      - job: terraform_fmt
        steps: 
          - checkout: self
          - script: |
              terraform fmt -check

      - job: terraform_validate
        dependsOn: terraform_init
        steps:
          - checkout: self
          #download previously published artifacts 
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              ArtifactName: 'terraform_init_artifact'
              downloadPath: '$(Build.SourcesDirectory)/terraform'
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              ArtifactName: 'tf_lock'
              downloadPath: '$(Build.SourcesDirectory)'

          - script: |
              echo "Flattening artifacts..."
              move "$(Build.SourcesDirectory)\terraform\terraform_init_artifact\.terraform" "$(Build.SourcesDirectory)\"
              move "$(Build.SourcesDirectory)\tf_lock\.terraform.lock.hcl" "$(Build.SourcesDirectory)\.terraform.lock.hcl"    
              
          - script: |
              terraform validate
              


